# Per-venue static profiles (09_configuration.md §4).
# Consumed by the adapters (10) and merged into effective config as per-exchange
# deltas (00_globals.md §6). Fixed 6-key shape — every venue present, no extras.
#
# ws_order_adapter records venue CAPABILITY (08 §6: all six native libs are
# WS-capable), not "adapter implemented in this repo".
#
# WS URLs are best-effort real per-venue endpoints, inert until an adapter reads
# them (0190 for Binance, 0420 for Bybit, 0430 for OKX; 0440–0460 for the rest).
# Correctable when each adapter is built and its venue team reviews.
#
# rate_limit_weight_per_minute sizes the token bucket (task 0200). Binance 2400 is
# the published fapi request-weight/min; Bybit 6000 and OKX 1200 are derived from
# their request-count caps (see those blocks); the remaining three are 2400
# placeholders, correctable per-venue at 0440–0460.

binance:
  taker_fee_pct: 0.05
  maker_fee_pct: 0.02
  submission_stagger_ms: 100
  rate_limit_reserve_pct: 10
  rate_limit_weight_per_minute: 2400 # published fapi request-weight/min (limiter bucket, task 0200)
  ws_order_adapter: true
  ws:
    public_url: wss://fstream.binance.com/ws
    private_url: wss://fstream.binance.com/ws
  # USD-M futures testnet (task 0260) — the testnet verification tier swaps to these
  # base URLs; base-URL swap is data, not a code branch. WS-API order endpoint
  # (wss://testnet.binancefuture.com/ws-fapi/v1) is handled by the native `binance`
  # SDK's own `testnet: true` flag (factory.ts), not a schema field here.
  testnet:
    ws:
      public_url: wss://fstream.binancefuture.com/ws
      private_url: wss://fstream.binancefuture.com/ws
    rest_url: https://testnet.binancefuture.com
  deltas: {}

bybit:
  taker_fee_pct: 0.055
  maker_fee_pct: 0.02
  submission_stagger_ms: 150 # 00_globals §6 — Bybit serializes at 150 ms
  rate_limit_reserve_pct: 10
  # Bybit publishes NO weight model (task 0420 decision D2): its caps are request counts —
  # 600 req/5 s per IP (= 7200/min) and 10 order create/amend/cancel per second per UID.
  # The limiter is one bucket/min with a `rate_limit_reserve_pct` order reserve, so 6000/min
  # makes the reserve exactly 600/min = 10/s = the venue's real order cap, leaving the general
  # lane 5400/min (90/s), safely under the 7200/min IP cap. One number, both lanes true, no
  # schema change; every Bybit call costs weight 1 (`adapter.ts` WEIGHT_REQUEST).
  rate_limit_weight_per_minute: 6000
  ws_order_adapter: true
  ws:
    public_url: wss://stream.bybit.com/v5/public/linear
    private_url: wss://stream.bybit.com/v5/private
  # Bybit testnet (task 0420) — the testnet verification tier swaps to these base URLs; the
  # native `bybit-api` SDK's own `testnet: true` flag (factory.ts) covers the WS trade API,
  # and ccxt's `setSandboxMode(true)` the REST host.
  testnet:
    ws:
      public_url: wss://stream-testnet.bybit.com/v5/public/linear
      private_url: wss://stream-testnet.bybit.com/v5/private
    rest_url: https://api-testnet.bybit.com
  deltas: {}

okx:
  taker_fee_pct: 0.05 # live ccxt market.taker on BTC-USDT-SWAP (0.0005)
  maker_fee_pct: 0.02 # live ccxt market.maker on BTC-USDT-SWAP (0.0002)
  submission_stagger_ms: 100
  # OKX publishes NO weight model either (task 0430): its caps are request counts, and unlike
  # Bybit there is no IP-wide aggregate — each read endpoint carries its own 20 req/2 s per-IP
  # cap (= 600/min), while orders are capped at 60 req/2 s per instrument ID (= 30/s) under a
  # 1000 req/2 s per-sub-account order ceiling. The limiter is one bucket/min split by
  # `rate_limit_reserve_pct`, so 1200/min at a 50% reserve makes **both** lanes true: the order
  # lane 600/min = 10/s (well under 30/s, and 10/s matches the 100 ms submission stagger), the
  # general lane 600/min = 20 req/2 s = exactly one read endpoint's published cap — the honest
  # bound when every read could in the worst case hit the same endpoint. Every OKX call draws
  # weight 1.
  rate_limit_reserve_pct: 50
  rate_limit_weight_per_minute: 1200
  ws_order_adapter: true
  ws:
    public_url: wss://ws.okx.com:8443/ws/v5/public
    private_url: wss://ws.okx.com:8443/ws/v5/private
  # OKX demo trading is a **flag** on the same account/host family (`demoTrading: true` on the
  # SDK clients, ccxt `setSandboxMode(true)`), not a separate testnet domain — only the WS host
  # differs (`wspap` vs `ws`). Keys are issued per-account with a passphrase; there is no
  # separate testnet signup.
  testnet:
    ws:
      public_url: wss://wspap.okx.com:8443/ws/v5/public
      private_url: wss://wspap.okx.com:8443/ws/v5/private
    rest_url: https://www.okx.com
  # No OKX-specific deltas: the venue runs the standard defaults, as every other venue does.
  # The spec's §4 worked example (funding_fee_timeout_seconds / leverage / ws_order_rest_fallback)
  # is an illustration of the delta *mechanism*, not a confirmed OKX fact — the mechanism is
  # covered by `test/unit/config/delta-merge.test.ts` and the synthetic profile in
  # `test/unit/config/exchange-schema.test.ts`.
  deltas: {}

bitget:
  taker_fee_pct: 0.06 # live ccxt market.taker on BTCUSDT (0.0006)
  maker_fee_pct: 0.02 # live ccxt market.maker on BTCUSDT (0.0002)
  submission_stagger_ms: 100
  # Bitget publishes no weight model either (task 0440): the UTA caps are request counts per
  # UID — 10 orders/s for place-order, 20/s for the order-info reads, ~20/s on the public
  # endpoints. The limiter is one bucket/min split by `rate_limit_reserve_pct`, so 1700/min at
  # a 35% reserve keeps **both** lanes under their cap: the order lane 595/min ≈ 9.9/s (under
  # the 10/s place-order cap, and matching the 100 ms submission stagger), the general lane
  # 1105/min ≈ 18.4/s (under the 20/s read cap). Every Bitget call draws weight 1.
  # 1800/33 was the first sizing and is wrong by a hair — it puts the general lane at 20.1/s,
  # *over* the read cap; the testnet `rate-limiter` check caught it (task 0440 Phase 2).
  rate_limit_reserve_pct: 35
  rate_limit_weight_per_minute: 1700
  ws_order_adapter: true
  # v3 hosts, not v2: task 0440 targets the Unified-Trading-Account (UTA) surface, which is
  # what the native SDK's WS order path (`WebsocketAPIClient`) speaks.
  ws:
    public_url: wss://ws.bitget.com/v3/ws/public
    private_url: wss://ws.bitget.com/v3/ws/private
  # Bitget has no separate testnet host: demo trading is a **header** on the same REST host
  # (`PAPTRADING: 1`, ccxt `setSandboxMode` / `demoTrading: true` on the native SDK), only the
  # WS host differs (`wspap` vs `ws`), as on OKX. The `SUSDT-FUTURES` product type (3 symbols
  # settled in `SUSDT`) belongs to the **v2 mix** API and is rejected by v3 (`40034`); on
  # v3/UTA, demo serves the ordinary `USDT-FUTURES` category — 24 symbols, `BTCUSDT` included
  # (verified live, task 0440). Demo keys are demo-only (the live host answers them `40099`).
  testnet:
    ws:
      public_url: wss://wspap.bitget.com/v3/ws/public
      private_url: wss://wspap.bitget.com/v3/ws/private
    rest_url: https://api.bitget.com
  deltas: {}

kucoin:
  taker_fee_pct: 0.06 # live ccxt market.taker on XBTUSDTM (0.0006)
  maker_fee_pct: 0.02 # live ccxt market.maker on XBTUSDTM (0.0002)
  submission_stagger_ms: 100
  # KuCoin is the only venue here with a **real published weight model** (task 0460): a per-UID
  # resource pool whose quota is deducted per endpoint and reset on a rolling 30 s window, with
  # HTTP 429 + venue code `429000` on exhaustion. Bybit/OKX/Bitget publish request *counts*, so
  # their adapters charge weight 1 per call; this one charges the venue's own weights (~6
  # endpoints, `src/adapters/exchanges/kucoin/{adapter,ws-orders}.ts`).
  #
  # The futures pool is 2000 weight / 30 s at VIP0 = 4000/min. Budgeting the full pool would run
  # the limiter at 100 % of the venue cap, so this is sized at 90 % (3600/min = 1800 per 30 s),
  # leaving headroom for anything outside the limiter's accounting. The 33 % reserve then makes
  # **both** lanes true:
  #   - order lane 3600 × 0.33 = 1188 weight/min ÷ 2 (add-order weight) = 594 orders/min ≈ 9.9/s,
  #     which is exactly what the 100 ms submission stagger asks for;
  #   - general lane 3600 × 0.67 = 2412 weight/min = 1206 per 30 s, well inside the pool
  #     alongside the order lane.
  rate_limit_reserve_pct: 33
  rate_limit_weight_per_minute: 3600
  ws_order_adapter: true
  # KuCoin does **not** publish a fixed WS host: a connection starts with a bullet-token POST
  # whose reply carries the real `instanceServers[].endpoint`, and the native SDK performs that
  # handshake itself (keyed by wsKey, not by URL). These are therefore the *token* endpoints, and
  # they are documentation rather than configuration — nothing in the adapter reads them.
  ws:
    public_url: https://api-futures.kucoin.com/api/v1/bullet-public
    private_url: https://api-futures.kucoin.com/api/v1/bullet-private
  # No `testnet:` key, deliberately: KuCoin decommissioned its futures sandbox. ccxt carries no
  # `urls.test` for `kucoinfutures` and `setSandboxMode(true)` silently sets `urls.api = {}`, so
  # the venue's verification tier is read-only against the live host instead (`src/testnet/kucoin/`).
  deltas: {}
