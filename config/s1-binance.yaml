# Strategy 1 — Negative Funding LONG, timed exit (docs/specs/01_strategy_1.md)
instance:
  exchange: binance
  strategy: s1
  enabled: true

sizing:
  amount_usd: 10
  leverage: 5

strategy_params:
  negative_funding_threshold_percent: -0.4
  entry_offset_seconds: 3
  exit_offset_seconds: 6

risk:
  max_concurrent_intents: 1
  max_notional_usd: 20
  max_daily_loss_usd: 100
  breaker_error_threshold: 5

symbols:
  mode: auto
  deny: []
