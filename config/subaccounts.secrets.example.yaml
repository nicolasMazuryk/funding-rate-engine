# EXAMPLE — copy to `config/subaccounts.secrets.yaml` (gitignored) and fill in real
# credentials. One row per (exchange, strategy) row in `config/subaccounts.yaml`.
#
# `api_passphrase` is required by okx / kucoin / bitget and must be OMITTED for
# binance / bybit (the schema is `.strict()` and rejects it there).

secrets:
  - exchange: binance
    strategy: s1-ws
    api_key: "<binance-s1-ws-api-key>"
    api_secret: "<binance-s1-ws-api-secret>"
  - exchange: bybit
    strategy: s1-ws
    api_key: "<bybit-s1-ws-api-key>"
    api_secret: "<bybit-s1-ws-api-secret>"
  - exchange: okx
    strategy: s1-ws
    api_key: "<okx-s1-ws-api-key>"
    api_secret: "<okx-s1-ws-api-secret>"
    api_passphrase: "<okx-s1-ws-api-passphrase>"
  - exchange: bitget
    strategy: s1-ws
    api_key: "<bitget-s1-ws-api-key>"
    api_secret: "<bitget-s1-ws-api-secret>"
    api_passphrase: "<bitget-s1-ws-api-passphrase>"
  - exchange: kucoin
    strategy: s1-ws
    api_key: "<kucoin-s1-ws-api-key>"
    api_secret: "<kucoin-s1-ws-api-secret>"
    api_passphrase: "<kucoin-s1-ws-api-passphrase>"
